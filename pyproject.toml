[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-algorithms"
version = "0.1.0"
description = "Interactive graph algorithms visualizer and solver"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=21.0",
    "pylint>=2.12",
    "flake8>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src --cov-report=html"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.pylint.messages_control]
disable = ["C0103", "R0913"]
